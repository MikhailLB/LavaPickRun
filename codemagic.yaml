workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 90
    environment:
      ios_signing:
        distribution_certificates: reference
        provisioning_profiles: reference
      vars:
        BUNDLE_ID: com.lavaplay.lava.peak.run
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
        working_directory: ios

      - name: Flutter build IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=1.2.0 \
            --build-number=11 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: VCUQ5S9F92
        issuer_id: e0982959-64ff-4995-bfce-f05db8411c67
        submit_to_testflight: false
