name: lava_peak_run
description: "Lava Peak Run - Volcano Clicker Game"
publish_to: 'none'

version: 1.0.0+7

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.3
  shared_preferences: ^2.5.3
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.11.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  provider: ^6.1.2
  audioplayers: ^6.1.0
  # Gray flow
  appsflyer_sdk: ^6.15.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.4
  http: ^1.3.0
  device_info_plus: ^11.3.3
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.1
  file_picker: ^11.0.2
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/Game_Name.png
    - assets/Logo_white.webp
    - assets/Assets/1_bg_asset.webp
    - assets/Assets/1_volcano_asset.webp
    - assets/Assets/2_bg_asset.webp
    - assets/Assets/2_volcano_asset.webp
    - assets/Assets/3_bg_asset.webp
    - assets/Assets/3_volcano_asset.webp
    - assets/Assets/4_bg_asset.webp
    - assets/Assets/4_volcano_asset.webp
    - assets/Assets/5_bg_asset.webp
    - assets/Assets/5_volcano_asset.webp
    - assets/Assets/6_bg_asset.webp
    - assets/Assets/6_volcano_asset.webp
    - assets/Assets/7_bg_asset.webp
    - assets/Assets/7_volcano_asset.webp
    - assets/Loading/Horizontal_Loading_Screen.mp4
    - assets/Loading/Vertical_Loading_Screen.mp4
    - assets/Loading/Loading_Bar_Empty.webp
    - assets/Loading/Loading_Bar_Half.webp
    - assets/Loading/Loading_Bar_Almost.webp
    - assets/Loading/Loading_Bar_Full.webp
    - assets/Notifications/Horizontal_Notifications_Screen.webp
    - assets/Notifications/Vertical_Notifications_Screen.webp
    - assets/Nowifi/Horizontal_Nowifi_Screen.webp
    - assets/Nowifi/Vertical_Nowifi_Screen.webp
    - assets/Sounds/tap.mp3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/Logo_white.webp"
  adaptive_icon_background: "#1A0500"
  adaptive_icon_foreground: "assets/Logo_white.webp"
  web:
    generate: false
