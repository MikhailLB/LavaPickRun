name: lava_peak_run
description: "Ember Ascent - a single-screen volcano timing & survival arcade"
publish_to: 'none'

version: 1.1.0+8

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  video_player: ^2.9.2
  shared_preferences: ^2.3.3
  webview_flutter: ^4.10.0

  appsflyer_sdk: ^6.16.2
  app_tracking_transparency: 2.0.5
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.6
  firebase_app_check: ^0.3.2+8
  flutter_local_notifications: ^17.2.4
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  webview_flutter_android: ^4.3.4
  webview_flutter_wkwebview: ^3.22.0
  url_launcher: ^6.3.2
  file_picker: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/Logo_white.webp"
  adaptive_icon_background: "#1A0500"
  adaptive_icon_foreground: "assets/Logo_white.webp"
  web:
    generate: false

flutter:
  uses-material-design: true

  # Disable SPM — Firebase managed via CocoaPods to avoid module redefinition.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/Game_Name.png
    - assets/Logo_white.webp
    - assets/Assets/1_bg_asset.webp
    - assets/Assets/1_volcano_asset.webp
    - assets/Assets/2_bg_asset.webp
    - assets/Assets/2_volcano_asset.webp
    - assets/Assets/3_bg_asset.webp
    - assets/Assets/3_volcano_asset.webp
    - assets/Assets/4_bg_asset.webp
    - assets/Assets/4_volcano_asset.webp
    - assets/Assets/5_bg_asset.webp
    - assets/Assets/5_volcano_asset.webp
    - assets/Assets/6_bg_asset.webp
    - assets/Assets/6_volcano_asset.webp
    - assets/Assets/7_bg_asset.webp
    - assets/Assets/7_volcano_asset.webp
    - assets/Loading/Horizontal_Loading_Screen.mp4
    - assets/Loading/Vertical_Loading_Screen.mp4
    - assets/Loading/Loading_Bar_Empty.webp
    - assets/Loading/Loading_Bar_Half.webp
    - assets/Loading/Loading_Bar_Almost.webp
    - assets/Loading/Loading_Bar_Full.webp
    - assets/Notifications/Horizontal_Notifications_Screen.png
    - assets/Notifications/Vertical_Notifications_Screen.png
    - assets/Nowifi/Horizontal_Nowifi_Screen.webp
    - assets/Nowifi/Vertical_Nowifi_Screen.webp
