name: gray_flow_template
description: "Gray flow iOS template — replace name and description for your app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Loading screen video (keep — used by SplashGate) ──────
  video_player: ^2.9.2

  # ── Gray gate layer ───────────────────────────────────────
  # TODO: before building, change every version number below
  # to something different from every other project in your
  # portfolio. Minor bumps are fine (e.g. ^6.16.2 → ^6.16.3).
  # This prevents binary fingerprinting across apps.
  appsflyer_sdk: ^6.16.2
  app_tracking_transparency: 2.0.5
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.6
  firebase_app_check: ^0.3.2+8
  flutter_local_notifications: ^17.2.4
  connectivity_plus: ^6.1.5
  http: ^1.5.0
  device_info_plus: ^11.5.0
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^8.3.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.4
  webview_flutter_wkwebview: ^3.22.0
  url_launcher: ^6.3.2
  file_picker: ^10.3.4
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  # TODO: replace with your app icon path
  image_path: "assets/Logo_white.webp"
  adaptive_icon_background: "#1A0500"
  adaptive_icon_foreground: "assets/Logo_white.webp"
  web:
    generate: false

flutter:
  uses-material-design: true

  # Disable SPM — Firebase managed via CocoaPods to prevent module conflicts.
  config:
    enable-swift-package-manager: false

  assets:
    # Gray flow splash/loading screen assets — keep these
    - assets/Logo_white.webp
    - assets/Loading/Horizontal_Loading_Screen.mp4
    - assets/Loading/Vertical_Loading_Screen.mp4
    - assets/Loading/Loading_Bar_Empty.webp
    - assets/Loading/Loading_Bar_Half.webp
    - assets/Loading/Loading_Bar_Almost.webp
    - assets/Loading/Loading_Bar_Full.webp
    - assets/Notifications/Horizontal_Notifications_Screen.webp
    - assets/Notifications/Vertical_Notifications_Screen.webp
    - assets/Nowifi/Horizontal_Nowifi_Screen.webp
    - assets/Nowifi/Vertical_Nowifi_Screen.webp
    # TODO: add your white-part game assets below
    # - assets/your_game_assets/
